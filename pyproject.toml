[project]
name = "silvasonic"
version = "0.8.0"
description = "Silvasonic Autonomous Bioacoustic Monitoring System"
readme = "README.md"
requires-python = ">=3.13, <3.14"
dependencies = [
    "silvasonic-core",
    "silvasonic-controller",
    "silvasonic-processor",
    "silvasonic-recorder",
    "silvasonic-web-mock",
    "silvasonic-db-viewer",
    "silvasonic-birdnet",
]

[tool.uv.workspace]
# UV automatically discovers all Python packages in these directories
members = ["services/*", "packages/*"]
exclude = [
    "services/database",
    "packages/tests",
    "services/gateway",

    "services/web-interface",
    "services/icecast",
    "services/batdetect",
    "services/weather",
    "services/tailscale",
]

[tool.uv.sources]
# Workspace dependencies must be explicitly declared here
silvasonic-core = { workspace = true }
silvasonic-controller = { workspace = true }
silvasonic-processor = { workspace = true }
silvasonic-recorder = { workspace = true }
silvasonic-web-mock = { workspace = true }
silvasonic-db-viewer = { workspace = true }
silvasonic-birdnet = { workspace = true }
silvasonic-test-utils = { workspace = true }


# --- DEVELOPMENT ENVIRONMENT ---

[dependency-groups]
dev = [
    # -- Code Quality & Formatting --
    "beautysh>=6.4.2",
    "djlint>=1.36.4",
    "pre-commit>=4.0.0",
    "pip-audit>=2.7.0",
    "rich>=13.0.0",               # Pretty logging in interactive dev terminals (not needed in prod containers)
    "ruff>=0.8.0",
    # The type checker, pinned to one release: a 0.0 checker changes its
    # findings between releases, so an upgrade is a commit of its own.
    "ty==0.0.97",
    "yamlfix>=1.19.1",

    # -- Testing Core --
    "httpx>=0.27.0",            # Modern async HTTP client (replaces requests)
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=6.0.0",
    "pytest-dotenv>=0.5.2",     # Automatically loads the .env file
    "pytest-mock>=3.15.1",
    "pytest-playwright>=0.5.0", # For E2E frontend tests
    "pytest-timeout>=2.3.1",    # Prevents tests from hanging indefinitely
    "pytest-xdist>=3.5.0",      # Enables parallel testing via 'pytest -n auto'

    # -- Testing Utilities (Mocking & Integration) --
    "faker>=23.0.0",          # Generates realistic dummy data (names, IPs, etc.)
    "minio>=7.2.14",          # Required by testcontainers.minio
    "polyfactory>=2.14.0",    # State-of-the-art factory for Pydantic/SQLAlchemy mocks
    "silvasonic-test-utils",  # Shared testcontainer fixtures (packages/test-utils)
    "structlog>=24.1.0",
    "tenacity>=9.1.2",        # Retry logic for flaky E2E/integration tests
    "testcontainers>=4.14.1", # Generic, without hardcoded database plugins

    # -- Type Stubs --
    "types-aiofiles",
    "types-psutil",
    "types-pyyaml",

    # -- Documentation --
    "mkdocs>=1.5.0,<2.0.0",
    "mkdocs-include-markdown-plugin>=6.0.0",
    "mkdocs-material>=9.5.0",
    "mkdocs-swagger-ui-tag>=0.4.0",
    "pygments>=2.20.0",
]


# --- TOOLING CONFIGURATION ---

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = [
    ".git",
    ".ruff_cache",
    ".venv*",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "D",   # pydocstyle
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
    # Every function annotated, which mypy's strict mode enforced and ty does
    # not check.
    "ANN", # flake8-annotations
]
ignore = [
    "D100", # Missing docstring in public module
    "D104", # Missing docstring in public package
    "D106", # Missing docstring in public nested class
    "B008", # Do not perform function call in argument defaults
    "ANN401", # Strict mode refused an implicit Any, never a written one
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["D101", "D102", "D103"]
"conftest.py" = ["D100", "D101", "D103"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-annotations]
# An __init__ with an annotated argument needs no `-> None`, as in mypy.
mypy-init-return = true


# ty over the whole workspace, as mypy checked `.`; scripts/check.py and
# scripts/ci.py run it ("ty"). The Python version follows requires-python.
# pydantic needs no plugin: ty reads a model's fields itself, so a constructor
# call is checked for missing, unknown and aliased fields, frozen models and
# (in pydantic's lax mode) the argument types.
[tool.ty.src]
include = ["conftest.py", "packages", "scripts", "services", "tests"]

[tool.ty.environment]
# scripts/ import their siblings by bare name (`from common import ...`), as
# Python puts a script's folder on sys.path, and tests/unit imports them the
# same way. The packages and services need no entry: uv installs every
# workspace member editable, and ty follows those installs into the shared
# `silvasonic` namespace, a new service included.
extra-paths = ["scripts"]

[tool.ty.analysis]
# The BirdNET spikes (scripts/spikes/birdnet/) import birdnetlib, which the
# workspace does not install.
allowed-unresolved-imports = ["birdnetlib.**"]

[tool.ty.rules]
# Off in ty's defaults, on in mypy's strict mode: a name bound on some paths
# only, and a generic without its type arguments (disallow_any_generics).
possibly-unresolved-reference = "error"
missing-type-argument = "error"
# A `ty: ignore` names the rule it silences, so it cannot hide a second finding
# on its line (scripts/check.py refuses `type: ignore` for the same reason).
blanket-ignore-comment = "error"
# unsound-return-statement (strict's warn_return_any) stays off: its findings
# depend on the order ty checks the files (astral-sh/ty#4221), and it is wrong
# on sorted(..., key=lambda ...) (astral-sh/ty#4311), both open in 0.0.97.

[tool.ty.terminal]
# ty's default, stated because the gate relies on it: a warning (deprecated, an
# unused `ty: ignore`) fails the check like an error.
error-on-warning = true

[tool.pytest.ini_options]
minversion = "8.0"
timeout = 30
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# testpaths searches these directories recursively for test_*.py
testpaths = ["tests", "services", "packages"]
python_files = ["test_*.py"]
addopts = "-v --durations=10 --import-mode=importlib"
env_files = [".env"] # Tells pytest-dotenv where the single source of truth is
markers = [
    "unit: fast, isolated tests without external dependencies.",
    "integration: requires external services (DB) to run.",
    "system: full-stack lifecycle tests requiring Podman socket and built images.",
    "system_hw_auto: automated hardware-dependent system tests (real USB mic required, never in CI).",
    "system_hw_manual: interactive hardware system tests (requires manual unplug/replug actions).",
    "e2e: browser tests via playwright running against a full stack.",
    "smoke: quick health checks on built images or deployments.",
]
filterwarnings = [
    # testcontainers uses deprecated @wait_container_is_ready internally
    "ignore::DeprecationWarning:testcontainers",
    # Importing async main() during tests causes harmless "never awaited" noise
    "ignore:coroutine 'main' was never awaited:RuntimeWarning",
    # runpy warns when re-executing a module already in sys.modules (test_main_guard)
    "ignore:.*found in sys.modules.*:RuntimeWarning",
]

[tool.coverage.run]
omit = ["*/tests/*", "tests/*", "*/test_utils/*"]
